<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <rect width="720" height="220" fill="#f6f8fa"/>
  <g font-family="Verdana, sans-serif" fill="#1f2328">
    <text x="24" y="36" font-size="16" font-weight="700">Heads in this calculator</text>
    <g font-size="14">
      <rect x="24" y="64" width="84" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="66" y="89" text-anchor="middle">9,000</text>
      <rect x="118" y="64" width="84" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="160" y="89" text-anchor="middle">12,000</text>
      <rect x="212" y="64" width="84" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="254" y="89" text-anchor="middle">15,000</text>
      <rect x="306" y="64" width="84" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="348" y="89" text-anchor="middle">18,000</text>
      <rect x="400" y="64" width="84" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="442" y="89" text-anchor="middle">24,000</text>
      <rect x="494" y="64" width="84" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="536" y="89" text-anchor="middle">30,000</text>
      <rect x="588" y="64" width="108" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
      <text x="642" y="89" text-anchor="middle">36,000</text>
    </g>
    <text x="24" y="150" font-size="15">Pick the smallest head at or above the room load.</text>
    <text x="24" y="186" font-size="13" fill="#57606a">The list is this calculator's. It is not a room-type chart.</text>
  </g>
</svg>
