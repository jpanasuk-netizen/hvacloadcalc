<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <rect width="720" height="340" fill="#f6f8fa"/>
  <g font-family="Verdana, sans-serif" fill="#1f2328">
    <text x="24" y="34" font-size="16" font-weight="700">Heat leaves the room</text>
    <rect x="24" y="56" width="320" height="200" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="40" y="82" font-size="13" font-weight="700">Indoors</text>
    <text x="40" y="112" font-size="14">Filter</text>
    <text x="40" y="138" font-size="14">Blower moves room air</text>
    <text x="40" y="164" font-size="14">Evaporator (cooling coil)</text>
    <text x="40" y="190" font-size="14">Thermostat calls for cooling</text>
    <text x="40" y="228" font-size="13" fill="#57606a">Heat and humidity leave the air here.</text>
    <rect x="376" y="56" width="320" height="200" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="392" y="82" font-size="13" font-weight="700">Outdoors</text>
    <text x="392" y="112" font-size="14">Compressor pumps refrigerant</text>
    <text x="392" y="138" font-size="14">Condenser releases heat</text>
    <text x="392" y="164" font-size="14">Fan blows outdoor air across it</text>
    <text x="392" y="228" font-size="13" fill="#57606a">The outdoor coil is the hot half.</text>
    <text x="24" y="292" font-size="13" fill="#57606a">Labels follow the DOE Energy Saver 101 description on this page.</text>
    <text x="24" y="316" font-size="13" fill="#57606a">No capacities are drawn.</text>
  </g>
</svg>
